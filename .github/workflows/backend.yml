name: Backend
on:
  push:
    branches: [main]
    paths: ["invent-back/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["invent-back/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inventory_test:ci-only-test-password@127.0.0.1:5432/inventory_test
    defaults:
      run:
        working-directory: invent-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm test
